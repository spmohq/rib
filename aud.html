<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Content Detail Extractor Prompt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient-start: #1f2937;
      --bg-gradient-end: #111827;
      --card-bg: rgba(31, 41, 55, 0.5);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-primary: #f9fafb;
      --text-secondary: #d1d5db;
      --text-heading: #ffffff;
      --accent-primary: #22d3ee;
      --accent-hover: #67e8f9;
      --accent-success: #34d399;
      --input-bg: #374151;
      --code-bg: rgba(0, 0, 0, 0.3);
      --shadow-color: rgba(0, 0, 0, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-primary);
      line-height: 1.6;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container {
      max-width: 850px;
      width: 100%;
      margin: 0 auto;
      flex-grow: 1;
    }
    header { text-align: center; margin-bottom: 40px; }
    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--text-heading);
      letter-spacing: -1px;
      margin-bottom: 10px;
    }
    p.subtitle { font-size: 1.1rem; color: var(--text-secondary); }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 8px 32px 0 var(--shadow-color);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 30px;
    }
    .input-section { margin-bottom: 25px; }
    .input-title {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
      color: var(--accent-primary);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    textarea {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--input-bg);
      color: white;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s;
      resize: vertical;
      min-height: 120px;
    }
    textarea:focus { border-color: var(--accent-primary); }
    .output-label {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
      color: var(--text-heading);
      font-size: 1.1rem;
    }
    .prompt-preview {
      background-color: var(--code-bg);
      padding: 20px;
      border-radius: 10px;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: 'Source Code Pro', monospace;
      font-size: 1rem;
      color: var(--text-primary);
      font-weight: 600;
      border: 1px solid var(--card-border);
      margin-bottom: 20px;
    }
    .copy-btn {
      padding: 12px 24px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--bg-gradient-end);
      background-color: var(--accent-primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
    .copy-btn:hover { background-color: var(--accent-hover); transform: scale(1.02); }
    .copy-btn.copied { background-color: var(--accent-success); }
    .icon { width: 18px; height: 18px; }
    .copied-icon { display: none; }
    .copy-btn.copied .copy-icon { display: none; }
    .copy-btn.copied .copied-icon { display: inline-block; }
    footer { text-align: center; padding: 40px 0; color: var(--text-secondary); font-size: 0.9rem; }
    @media (max-width: 600px) { h1 { font-size: 2rem; } .card { padding: 20px; } }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Prompt Extractor Generator</h1>
      <p class="subtitle">Convert raw text into a structured analysis prompt.</p>
    </header>

    <main>
      <div class="card">
        <div class="input-section">
          <label class="input-title">Input Box:</label>
          <textarea 
            id="textInput" 
            placeholder="An aspirant digital creator who wants to earn money with Facebook's content monetisation program cannot understand what to post next."
            oninput="generate()"
          ></textarea>
        </div>

        <label class="output-label">Generated Prompt</label>
        <pre id="output" class="prompt-preview"></pre>

        <button class="copy-btn" id="copyBtn" onclick="copy()">
          <svg class="icon copy-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5a3.375 3.375 0 00-3.375-3.375H9.75" /></svg>
          <svg class="icon copied-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>
          <span id="copyBtnText">Copy Prompt</span>
        </button>
      </div>
    </main>

    <footer>
      <p>Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.</p>
    </footer>
  </div>

  <script>
    function generate() {
      const userInput = document.getElementById('textInput').value.trim();
      const textToDisplay = userInput || "[Text]";
      
      const template = `Read and understand the TEXT given below.

From the TEXT, extract or logically infer the following details and fill them clearly:

Primary Platform:
Monetisation Model:
Target Audience:
Audience Situation:
Primary Outcome:

If any detail is not explicitly mentioned, infer it from context as accurately as possible.
Do not add assumptions beyond what the TEXT reasonably implies.

TEXT:

${textToDisplay}`;
      
      document.getElementById('output').textContent = template;
    }

    function copy() {
      const text = document.getElementById('output').textContent;
      const btn = document.getElementById('copyBtn');
      const btnText = document.getElementById('copyBtnText');

      navigator.clipboard.writeText(text).then(() => {
        btn.classList.add('copied');
        btnText.textContent = 'Copied!';
        setTimeout(() => {
          btn.classList.remove('copied');
          btnText.textContent = 'Copy Prompt';
        }, 2000);
      });
    }

    // Run once on load to show placeholder state
    generate();
  </script>
</body>
</html>
